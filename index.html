<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toyota Sequoia Pumpkin Packing Challenge</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@600;700&display=swap');

    :root {
      --sky-top: #fde047;
      --sky-bottom: #f97316;
      --sequoia-red: #dc2626;
      --sequoia-dark: #991b1b;
      --trunk-interior: #262626;
      --pumpkin-orange: #ff7700;
      --wood-brown: #854d0e;
      --card-bg: rgba(255, 255, 255, 0.92);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(180deg, #fdba74 0%, #ea580c 60%, #9a3412 100%);
      color: #1e293b;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Bar */
    header {
      background: rgba(255, 255, 255, 0.95);
      padding: 10px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      z-index: 20;
    }

    .logo {
      font-family: 'Fredoka One', cursive;
      font-size: 1.6rem;
      color: #ea580c;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge-toyota {
      background: #dc2626;
      color: white;
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 20px;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
    }

    .stats-bar {
      display: flex;
      gap: 16px;
    }

    .stat-pill {
      background: #fef3c7;
      border: 2px solid #f59e0b;
      padding: 6px 16px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 0.95rem;
      color: #78350f;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stat-value {
      font-family: 'Fredoka One', cursive;
      font-size: 1.2rem;
      color: #d97706;
    }

    /* Main Play Area */
    #game-stage {
      flex: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      position: relative;
    }

    /* Cartoon Sequoia Rear View */
    .sequoia-container {
      position: relative;
      width: 580px;
      height: 480px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }

    /* Sequoia Body Graphic (SVG) */
    .sequoia-svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 15px 25px rgba(0,0,0,0.3));
    }

    /* Sequoia Trunk Opening Zone */
    #trunk-drop-zone {
      position: absolute;
      top: 135px;
      left: 110px;
      width: 360px;
      height: 260px;
      background: #1e1e1e;
      border-radius: 16px 16px 4px 4px;
      border: 4px dashed #f59e0b;
      box-shadow: inset 0 10px 30px rgba(0,0,0,0.8);
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 4px;
      padding: 8px;
      overflow: hidden;
    }

    /* Trunk Grid Cells for placement */
    .grid-cell {
      border: 1px rgba(255,255,255,0.08) solid;
      border-radius: 6px;
      transition: background 0.15s ease;
      cursor: pointer;
    }

    .grid-cell:hover {
      background: rgba(245, 158, 11, 0.25);
    }

    /* Animated Rear Hatch Door */
    #sequoia-hatch {
      position: absolute;
      top: 125px;
      left: 105px;
      width: 370px;
      height: 275px;
      background: linear-gradient(180deg, #dc2626 0%, #b91c1c 85%, #7f1d1d 100%);
      border-radius: 20px 20px 8px 8px;
      border: 4px solid #991b1b;
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
      transform-origin: top center;
      transform: scaleY(0); /* Closed when scaleY(1) */
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
    }

    #sequoia-hatch.closed {
      transform: scaleY(1);
    }

    .hatch-window {
      width: 80%;
      height: 90px;
      background: #38bdf8;
      border: 4px solid #1e293b;
      border-radius: 12px;
      opacity: 0.85;
    }

    .hatch-badge {
      background: #ffffff;
      padding: 4px 16px;
      border-radius: 20px;
      font-family: 'Fredoka One', cursive;
      font-size: 1rem;
      color: #dc2626;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    /* Right Side: Pumpkin Patch Pile */
    .pile-container {
      width: 380px;
      background: var(--card-bg);
      border-radius: 24px;
      border: 4px solid #fef08a;
      padding: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .pile-title {
      font-family: 'Fredoka One', cursive;
      font-size: 1.3rem;
      color: #9a3412;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .pumpkin-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      max-height: 320px;
      overflow-y: auto;
      padding: 4px;
    }

    .pumpkin-card {
      background: #fef3c7;
      border: 3px solid #fde047;
      border-radius: 16px;
      padding: 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
    }

    .pumpkin-card:hover {
      transform: translateY(-4px) scale(1.03);
      border-color: #f59e0b;
    }

    .pumpkin-card.selected {
      background: #ffedd5;
      border-color: #ea580c;
      box-shadow: 0 0 0 4px rgba(234, 88, 12, 0.3);
    }

    .pumpkin-card.placed {
      opacity: 0.3;
      pointer-events: none;
      filter: grayscale(0.8);
    }

    .pumpkin-svg-wrap {
      width: 70px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pumpkin-label {
      font-weight: 700;
      font-size: 0.85rem;
      color: #78350f;
      margin-top: 6px;
    }

    /* Rotation & Actions Panel */
    .controls-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }

    .btn-rotate {
      background: #f59e0b;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 12px;
      font-family: 'Fredoka One', cursive;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 10px rgba(245, 158, 11, 0.4);
      transition: transform 0.15s ease;
    }

    .btn-rotate:hover {
      transform: scale(1.05);
      background: #d97706;
    }

    .action-bar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 16px;
      z-index: 15;
    }

    .btn-main {
      padding: 14px 28px;
      border-radius: 50px;
      font-family: 'Fredoka One', cursive;
      font-size: 1.2rem;
      border: 3px solid white;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      transition: all 0.2s ease;
    }

    .btn-close-hatch {
      background: linear-gradient(135deg, #22c55e, #15803d);
      color: white;
    }

    .btn-close-hatch:hover {
      transform: scale(1.05) translateY(-2px);
    }

    .btn-retry {
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      color: white;
    }

    .btn-retry:hover {
      transform: scale(1.05) translateY(-2px);
    }

    /* Floating Placed Pumpkin Graphic in Trunk */
    .placed-pumpkin {
      position: absolute;
      transition: transform 0.2s ease;
      z-index: 5;
      pointer-events: none;
    }

    /* Modal Overlay */
    .modal {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal.active { opacity: 1; pointer-events: auto; }

    .modal-content {
      background: #fff;
      border-radius: 30px;
      padding: 36px;
      text-align: center;
      max-width: 440px;
      width: 90%;
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
      border: 6px solid #f59e0b;
    }

    .modal-title {
      font-family: 'Fredoka One', cursive;
      font-size: 2.2rem;
      color: #ea580c;
      margin-bottom: 12px;
    }

    .modal-btn {
      background: #ea580c;
      color: white;
      border: none;
      padding: 14px 36px;
      border-radius: 30px;
      font-family: 'Fredoka One', cursive;
      font-size: 1.2rem;
      margin-top: 20px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(234, 88, 12, 0.4);
    }

    /* Toast */
    #toast {
      position: absolute;
      top: 80px; left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: #dc2626;
      color: white;
      padding: 12px 24px;
      border-radius: 30px;
      font-weight: 700;
      font-family: 'Fredoka One', cursive;
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 50;
      box-shadow: 0 10px 25px rgba(220, 38, 38, 0.4);
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <span class="badge-toyota">TOYOTA</span> Sequoia Pumpkin Pack 🎃
    </div>
    <div class="stats-bar">
      <div class="stat-pill">Level: <span id="stat-level" class="stat-value">1</span></div>
      <div class="stat-pill">Score: <span id="stat-score" class="stat-value">0</span></div>
      <div class="stat-pill">Retries Left: <span id="stat-retries" class="stat-value">3</span></div>
    </div>
  </header>

  <div id="game-stage">

    <!-- Cartoon Toyota Sequoia (Rear View) -->
    <div class="sequoia-container">
      <svg class="sequoia-svg" viewBox="0 0 600 500" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Sequoia Outer Roof & Body -->
        <path d="M100 130 C100 80, 140 60, 300 60 C460 60, 500 80, 500 130 L530 420 C530 450, 510 460, 480 460 L120 460 C90 460, 70 450, 70 420 Z" fill="#dc2626" stroke="#991b1b" stroke-width="8"/>
        <!-- Roof Rack -->
        <rect x="160" y="45" width="280" height="15" rx="6" fill="#1e293b"/>
        <!-- Taillights -->
        <rect x="75" y="200" width="35" height="110" rx="10" fill="#ef4444" stroke="#7f1d1d" stroke-width="4"/>
        <rect x="490" y="200" width="35" height="110" rx="10" fill="#ef4444" stroke="#7f1d1d" stroke-width="4"/>
        <!-- Rear Bumper & Hitch -->
        <rect x="90" y="420" width="420" height="40" rx="10" fill="#334155" stroke="#0f172a" stroke-width="4"/>
        <!-- Toyota Badge -->
        <ellipse cx="300" cy="95" rx="22" ry="14" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
        <text x="300" y="99" font-family="Fredoka One" font-size="10" fill="#dc2626" text-anchor="middle">TOYOTA</text>
        <text x="300" y="445" font-family="Fredoka One" font-size="16" fill="#ffffff" text-anchor="middle">S E Q U O I A</text>
      </svg>

      <!-- Sequoia Trunk Opening -->
      <div id="trunk-drop-zone"></div>

      <!-- Cartoon Rear Hatch Door -->
      <div id="sequoia-hatch">
        <div class="hatch-window"></div>
        <div class="hatch-badge">TOYOTA SEQUOIA</div>
      </div>
    </div>

    <!-- Right Side: Pumpkin Pile -->
    <div class="pile-container">
      <div class="pile-title">🌾 Harvest Pumpkin Pile</div>
      <div class="pumpkin-grid" id="pumpkin-grid"></div>

      <div class="controls-panel">
        <button class="btn-rotate" onclick="rotateSelectedPumpkin()"> rotate ⟳</button>
        <span style="font-weight:700; font-size:0.85rem; color:#78350f;" id="rot-label">Angle: 0°</span>
      </div>
    </div>

  </div>

  <!-- Bottom Action Buttons -->
  <div class="action-bar">
    <button class="btn-main btn-retry" onclick="retryRound()">
      🔄 Empty Trunk (<span id="btn-retry-count">3</span>)
    </button>
    <button class="btn-main btn-close-hatch" onclick="closeHatchTest()">
      🚗 Close Sequoia Hatch!
    </button>
  </div>

  <div id="toast">Hatch blocked! Rearrange your pumpkins!</div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <div class="modal-title" id="modal-title">Level Cleared! 🎉</div>
      <p id="modal-desc" style="color:#64748b; font-size:1.05rem; line-height:1.5;">Great packing! All pumpkins fit into the Sequoia!</p>
      <button class="modal-btn" onclick="nextLevel()">Next Level ➔</button>
    </div>
  </div>

  <script>
    let level = 1;
    let score = 0;
    let retries = 3;
    let selectedIndex = -1;
    let currentRotation = 0; // 0, 90, 180, 270

    // Grid: 6 columns x 4 rows
    const COLS = 6;
    const ROWS = 4;
    let gridState = Array(ROWS).fill(null).map(() => Array(COLS).fill(false));

    let availablePumpkins = [];
    let placedPumpkins = [];

    // Web Audio Synthesizer
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSfx(type) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'pop') {
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
          gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
          osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'placed') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(180, now);
          osc.frequency.exponentialRampToValueAtTime(90, now + 0.15);
          gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
          osc.start(now); osc.stop(now + 0.15);
        } else if (type === 'win') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523, now);
          osc.frequency.setValueAtTime(659, now + 0.1);
          osc.frequency.setValueAtTime(783, now + 0.2);
          gain.gain.setValueAtTime(0.25, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
          osc.start(now); osc.stop(now + 0.4);
        } else if (type === 'fail') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(180, now);
          osc.frequency.linearRampToValueAtTime(80, now + 0.25);
          gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
          osc.start(now); osc.stop(now + 0.25);
        }
      } catch(e){}
    }

    // Initialize Trunk Grid UI
    function initGridUI() {
      const dropZone = document.getElementById('trunk-drop-zone');
      dropZone.innerHTML = '';
      gridState = Array(ROWS).fill(null).map(() => Array(COLS).fill(false));

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = document.createElement('div');
          cell.className = 'grid-cell';
          cell.dataset.row = r;
          cell.dataset.col = c;
          cell.onclick = () => onGridCellClick(r, c);
          dropZone.appendChild(cell);
        }
      }
    }

    // Generate SVG Cartoon Pumpkin shapes
    function getPumpkinSVG(type, color, rotation = 0) {
      let shape = '';
      if (type === 'fat') {
        shape = `<ellipse cx="35" cy="40" rx="30" ry="22" fill="${color}" stroke="#b45309" stroke-width="3"/>
                 <path d="M 35 18 Q 30 10 25 8" stroke="#15803d" stroke-width="4" fill="none" stroke-linecap="round"/>`;
      } else if (type === 'tall') {
        shape = `<ellipse cx="35" cy="35" rx="20" ry="28" fill="${color}" stroke="#b45309" stroke-width="3"/>
                 <path d="M 35 8 Q 38 2 42 0" stroke="#15803d" stroke-width="4" fill="none" stroke-linecap="round"/>`;
      } else if (type === 'mini') {
        shape = `<ellipse cx="35" cy="40" rx="16" ry="14" fill="${color}" stroke="#b45309" stroke-width="3"/>
                 <path d="M 35 26 Q 32 20 28 18" stroke="#15803d" stroke-width="3" fill="none" stroke-linecap="round"/>`;
      } else { // round/lumpy
        shape = `<ellipse cx="35" cy="38" rx="26" ry="24" fill="${color}" stroke="#b45309" stroke-width="3"/>
                 <path d="M 35 14 Q 32 8 28 6" stroke="#15803d" stroke-width="4" fill="none" stroke-linecap="round"/>`;
      }

      return `<svg width="70" height="70" viewBox="0 0 70 70" style="transform: rotate(${rotation}deg); transition: transform 0.2s ease;">
                ${shape}
              </svg>`;
    }

    // Generate Level Pumpkins
    function generateLevelPumpkins() {
      availablePumpkins = [];
      const count = 4 + Math.min(level * 2, 8);
      const types = ['fat', 'tall', 'mini', 'round'];
      const colors = ['#f97316', '#fbbf24', '#ea580c', '#fef08a', '#84cc16'];

      for (let i = 0; i < count; i++) {
        const t = types[Math.floor(Math.random() * types.length)];
        const c = colors[Math.floor(Math.random() * colors.length)];

        // Grid span dimensions (w, h in cells)
        let w = t === 'fat' ? 2 : (t === 'mini' ? 1 : 1);
        let h = t === 'tall' ? 2 : (t === 'mini' ? 1 : 1);

        availablePumpkins.push({
          id: i,
          type: t,
          color: c,
          widthCells: w,
          heightCells: h,
          pts: (w * h) * 100,
          placed: false
        });
      }

      renderPileUI();
    }

    function renderPileUI() {
      const grid = document.getElementById('pumpkin-grid');
      grid.innerHTML = '';

      availablePumpkins.forEach((p, idx) => {
        const card = document.createElement('div');
        card.className = `pumpkin-card ${p.placed ? 'placed' : ''} ${selectedIndex === idx ? 'selected' : ''}`;
        card.onclick = () => selectPumpkin(idx);

        card.innerHTML = `
          <div class="pumpkin-svg-wrap">
            ${getPumpkinSVG(p.type, p.color, selectedIndex === idx ? currentRotation : 0)}
          </div>
          <div class="pumpkin-label">+${p.pts} pts</div>
        `;
        grid.appendChild(card);
      });
    }

    function selectPumpkin(idx) {
      if (availablePumpkins[idx].placed) return;
      selectedIndex = idx;
      playSfx('pop');
      renderPileUI();
    }

    function rotateSelectedPumpkin() {
      if (selectedIndex === -1) return;
      currentRotation = (currentRotation + 90) % 360;
      document.getElementById('rot-label').innerText = `Angle: ${currentRotation}°`;
      playSfx('pop');
      renderPileUI();
    }

    // Grid placement
    function onGridCellClick(r, c) {
      if (selectedIndex === -1) return;
      const p = availablePumpkins[selectedIndex];

      // Calculate span with rotation
      let w = p.widthCells;
      let h = p.heightCells;
      if (currentRotation === 90 || currentRotation === 270) {
        let tmp = w; w = h; h = tmp;
      }

      // Check if fits inside grid boundaries
      if (r + h > ROWS || c + w > COLS) {
        showToast("Pumpkin doesn't fit in that spot!");
        playSfx('fail');
        return;
      }

      // Check overlap with existing placed pumpkins
      for (let ri = r; ri < r + h; ri++) {
        for (let ci = c; ci < c + w; ci++) {
          if (gridState[ri][ci]) {
            showToast("Spot already occupied!");
            playSfx('fail');
            return;
          }
        }
      }

      // Fill grid state
      for (let ri = r; ri < r + h; ri++) {
        for (let ci = c; ci < c + w; ci++) {
          gridState[ri][ci] = true;
        }
      }

      // Place visual pumpkin in trunk
      const dropZone = document.getElementById('trunk-drop-zone');
      const cellW = dropZone.clientWidth / COLS;
      const cellH = dropZone.clientHeight / ROWS;

      const pEl = document.createElement('div');
      pEl.className = 'placed-pumpkin';
      pEl.style.left = `${c * cellW + 4}px`;
      pEl.style.top = `${r * cellH + 4}px`;
      pEl.style.width = `${w * cellW - 8}px`;
      pEl.style.height = `${h * cellH - 8}px`;
      pEl.innerHTML = getPumpkinSVG(p.type, p.color, currentRotation);

      dropZone.appendChild(pEl);

      p.placed = true;
      placedPumpkins.push(pEl);

      score += p.pts;
      document.getElementById('stat-score').innerText = score;
      playSfx('placed');

      selectedIndex = -1;
      currentRotation = 0;
      document.getElementById('rot-label').innerText = `Angle: 0°`;
      renderPileUI();
    }

    function retryRound() {
      if (retries <= 0) {
        showToast("No retries left!");
        return;
      }
      retries--;
      document.getElementById('stat-retries').innerText = retries;
      document.getElementById('btn-retry-count').innerText = retries;

      emptyTrunk();
      playSfx('fail');
    }

    function emptyTrunk() {
      placedPumpkins.forEach(el => el.remove());
      placedPumpkins = [];
      gridState = Array(ROWS).fill(null).map(() => Array(COLS).fill(false));
      availablePumpkins.forEach(p => p.placed = false);
      selectedIndex = -1;
      renderPileUI();
    }

    function closeHatchTest() {
      if (placedPumpkins.length === 0) {
        showToast("Put some pumpkins in the trunk first!");
        return;
      }

      const hatch = document.getElementById('sequoia-hatch');
      hatch.classList.add('closed');

      setTimeout(() => {
        // Check if all available pumpkins placed
        const unplaced = availablePumpkins.filter(p => !p.placed);

        if (unplaced.length === 0) {
          playSfx('win');
          showModal(`Level ${level} Cleared! 🎉`, `Fantastic packing! Every pumpkin fits perfectly in the Sequoia trunk! Total Score: ${score}`);
        } else {
          // Hatch pops back up
          playSfx('fail');
          showToast("Hatch blocked! Not all pumpkins fit!");
          setTimeout(() => hatch.classList.remove('closed'), 600);
        }
      }, 700);
    }

    function showModal(title, desc) {
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-desc').innerText = desc;
      document.getElementById('modal').classList.add('active');
    }

    function nextLevel() {
      document.getElementById('modal').classList.remove('active');
      document.getElementById('sequoia-hatch').classList.remove('closed');

      level++;
      document.getElementById('stat-level').innerText = level;

      emptyTrunk();
      generateLevelPumpkins();
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    window.onload = () => {
      initGridUI();
      generateLevelPumpkins();
    };
  </script>
</body>
</html>
